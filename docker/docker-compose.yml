services:
  postgres:
    image: postgres:17
    container_name: enterprise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant_data:/qdrant/storage

  analyst:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: enterprise-analyst

    restart: unless-stopped

    env_file:
      - ../.env

    ports:
      - "8001:8001"

    depends_on:
      - postgres
      - qdrant

volumes:
  postgres_data:
